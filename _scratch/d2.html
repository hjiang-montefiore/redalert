<!doctype html><meta charset="utf-8"><pre id="o"></pre>
<script src="../js/util.js"></script><script src="../js/config.js"></script>
<script src="../js/facts.js"></script><script src="../js/rules.js"></script>
<script src="../js/eras.js"></script><script src="../js/heavyair.js"></script>
<script src="../js/generations.js"></script>
<script>
var L=[];function p(){L.push([].slice.call(arguments).join(" "));}
try{
CFG.CUE_OPTICAL=5.5;
var cue={};var cueUnits={};
for(var u in UNITS){var ud=UNITS[u],ws=ud.weapons||[];
 for(var j=0;j<ws.length;j++){var wk=ws[j],w=WEAPONS[wk];
  if(!w||w.antiRadiation||!w.tgt)continue;
  if(!w.tgt.ground&&!w.tgt.sea)continue;
  if(ud.cat==="naval"&&w.proj==="shell"){cue[wk]=1;continue;}
  if(w.proj==="missile"&&w.tgt.sea&&w.range>CFG.CUE_OPTICAL*1.6){cue[wk]=1;}
 }}
["tow_bradley","atgm_inf__at_p","hellfire","maverick","kh29","torp_mk48","srbm_mod__tel_c"].forEach(function(k){
 var w=WEAPONS[k]; if(!w){p("MISSING "+k);return;}
 p(k,"proj="+w.proj,"range="+w.range,"tgt="+JSON.stringify(w.tgt),"CUED="+!!cue[k]);});
// count cued by category of carrier
var landCued={},navalCued={},airCued2={};
for(var u2 in UNITS){var ud2=UNITS[u2],ws2=ud2.weapons||[];
 for(var j2=0;j2<ws2.length;j2++){var k2=ws2[j2];if(!cue[k2])continue;
  if(ud2.cat==="naval")navalCued[k2]=1;else if(ud2.layer==="air")airCued2[k2]=1;else landCued[k2]=1;}}
p("cued total",Object.keys(cue).length,"| land-carried",Object.keys(landCued).length,
  "| naval",Object.keys(navalCued).length,"| air-carried",Object.keys(airCued2).length);
p("land-carried cued sample:",Object.keys(landCued).slice(0,25).join(", "));
// per era
var eras=["e50","e60","e80","e90","e00","e20"];
eras.forEach(function(E){
 var seen={},cu=0,tot=0;
 for(var u3 in UNITS){var ud3=UNITS[u3];
  if(typeof inEra==="function"&&!inEra(ud3,E))continue;
  var ws3=ud3.weapons||[];for(var j3=0;j3<ws3.length;j3++){var k3=ws3[j3];if(seen[k3])continue;seen[k3]=1;tot++;if(cue[k3])cu++;}}
 p("era "+E+": cued "+cu+" / "+tot+" mounts");
});
}catch(e){p("ERR "+e.message+"\n"+e.stack);}
document.getElementById("o").textContent=L.join("\n");
</script>
