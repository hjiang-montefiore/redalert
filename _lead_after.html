<!doctype html><meta charset="utf-8"><body>
<script src="js/three.min.js"></script>
<script src="js/models3d.js"></script>
<script>var UNIT_MODELS = {};</script>
<script src="/private/tmp/claude-501/-Users-hjiang-Desktop-redalert/6321f229-fd3c-451c-bfae-d045a3e13cf4/scratchpad/lead/units3d_lead.js"></script>
<script>
var KEYS = ["ifv_n","spg_n","mlrs_n","mbt_n","hvy_n","mbt_p","hvy_p","ifv_p","ifv_c","lt_p","lt_c",
            "mlrs_c","hvy_c","atgmv_p","spg_p","spaag_p","lt_n","atgmv_n","supply_n","supply_p",
            "supply_c","recon_n","recon_p","recon_c"];
var C = { team: 0xcc3333 };
var out = [];
KEYS.forEach(function (k) {
  var d = UNIT_MODELS[k];
  if (!d) { out.push(k + " MISSING"); return; }
  var g;
  try { g = d.build(THREE, Models3D, C); } catch (e) { out.push(k + " THROW " + e.message); return; }
  g.updateMatrixWorld(true);
  var b = new THREE.Box3().setFromObject(g);
  var tris = 0, meshes = 0, rw = 0, tur = 0, topW = -99;
  g.traverse(function (o) {
    if (o.isGroup && o.name === "roadwheel") rw++;
    if (o.isGroup && o.name === "turret") tur++;
    if (o.isMesh) {
      meshes++;
      var mb = new THREE.Box3().setFromObject(o);
      if (mb.max.x - mb.min.x >= 0.25 && mb.max.y - mb.min.y >= 0.25 && mb.max.z > topW) topW = mb.max.z;
      var ge = o.geometry;
      tris += ge.index ? ge.index.count / 3 : ge.attributes.position.count / 3;
    }
  });
  out.push(k +
    " L=" + (b.max.x - b.min.x).toFixed(2) +
    " W=" + (b.max.y - b.min.y).toFixed(2) +
    " H=" + (b.max.z - b.min.z).toFixed(2) +
    " x[" + b.min.x.toFixed(2) + "," + b.max.x.toFixed(2) + "]" +
    " y[" + b.min.y.toFixed(2) + "," + b.max.y.toFixed(2) + "]" +
    " z[" + b.min.z.toFixed(2) + "," + b.max.z.toFixed(2) + "]" +
    " topW=" + topW.toFixed(2) + " tris=" + tris + " meshes=" + meshes + " rw=" + rw + " tur=" + tur);
});
document.body.appendChild(document.createTextNode("@@@" + out.join("\n") + "@@@"));
</script>
