<!doctype html>
<html><head><meta charset="utf-8"><title>buildings-b preview</title>
<style>body{margin:0;background:#20262a}canvas{display:block}</style></head>
<body>
<script src="../js/three.min.js"></script>
<script src="../js/models3d.js"></script>
<script>var UNIT_MODELS={},BLD_MODELS={};</script>
<script src="bldb_models.js"></script>
<script>
var W = 1000, H = 760;
var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

function build(key) {
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2b3238);
  var hemi = new THREE.HemisphereLight(0xbfd4e6, 0x4a4436, 0.85);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff2dd, 1.35);
  sun.position.set(40, 70, 30); scene.add(sun);
  var fill = new THREE.DirectionalLight(0x9fb6c8, 0.35);
  fill.position.set(-40, 20, -30); scene.add(fill);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: 0x6b6a52, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02;
  scene.add(ground);
  var tpl = BLD_MODELS[key].build(THREE, Models3D, { team: "#c0392b" });
  tpl.traverse(function (o) {
    if (o.isMesh) {
      var list = Array.isArray(o.material) ? o.material : [o.material];
      list.forEach(function (m) {
        if (!m || m.userData._d) return; m.userData._d = 1;
        if (m.color) m.color.convertSRGBToLinear();
        if (m.emissive) m.emissive.convertSRGBToLinear();
        if (m.map) m.map.encoding = THREE.sRGBEncoding;
      });
    }
  });
  tpl.rotation.x = -Math.PI / 2;
  var wrap = new THREE.Group(); wrap.add(tpl); scene.add(wrap);
  return scene;
}
window.__shot = function (key, az, el, dist, ty) {
  var scene = build(key);
  var cam = new THREE.PerspectiveCamera(38, W / H, 0.5, 900);
  var a = az * Math.PI / 180, e = el * Math.PI / 180;
  cam.position.set(Math.cos(a) * Math.cos(e) * dist, Math.sin(e) * dist, Math.sin(a) * Math.cos(e) * dist);
  cam.lookAt(0, ty || 4, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL("image/png");
};
window.__stats = function () {
  var out = [];
  for (var k in BLD_MODELS) {
    var g = BLD_MODELS[k].build(THREE, Models3D, { team: "#c0392b" });
    var t = 0, m = 0;
    g.traverse(function (o) {
      if (o.isMesh) { m++; t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; }
    });
    out.push(k + " tris=" + Math.round(t) + " meshes=" + m);
  }
  return out.join("\n");
};
window.__ready = true;
</script>
</body></html>
